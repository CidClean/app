name: Production checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  backend-import-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile Python modules
        run: python -m py_compile backend/server.py backend/main.py backend/production.py

      - name: Import production app
        working-directory: backend
        env:
          APP_ENV: development
          APP_TIMEZONE: America/Monterrey
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: barber_page_ci
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_INITIAL_PASSWORD: CiOnlyPassword1!
          CORS_ORIGINS: http://localhost:8081
        run: |
          python - <<'PY'
          from production import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/health',
              '/api/bookings',
              '/api/privacy-notice',
              '/api/admin/login',
              '/api/admin/bookings',
          }
          missing = required - paths
          if missing:
              raise SystemExit(f'Missing required routes: {sorted(missing)}')
          print(f'Validated {len(paths)} API routes')
          PY

  frontend-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Enable Yarn
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --non-interactive

      - name: Export web application
        env:
          EXPO_PUBLIC_BACKEND_URL: https://barber-page-api.onrender.com
        run: yarn build:web

      - name: Verify critical admin routes
        run: |
          test -f dist/admin/dashboard.html
          test -f dist/admin/reservas.html
          test -f dist/admin/horarios.html
          test -f dist/admin/login.html
