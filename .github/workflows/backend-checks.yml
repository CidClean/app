name: Backend checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  import-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile Python modules
        run: python -m py_compile backend/server.py backend/main.py

      - name: Import production app
        working-directory: backend
        env:
          APP_ENV: development
          APP_TIMEZONE: America/Monterrey
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: barber_page_ci
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_INITIAL_PASSWORD: CiOnlyPassword1!
          CORS_ORIGINS: http://localhost:8081
        run: |
          python - <<'PY'
          from main import app
          paths = {route.path for route in app.routes}
          required = {
              '/api/health',
              '/api/bookings',
              '/api/privacy-notice',
              '/api/admin/login',
              '/api/admin/bookings',
          }
          missing = required - paths
          if missing:
              raise SystemExit(f'Missing required routes: {sorted(missing)}')
          print(f'Validated {len(paths)} API routes')
          PY
