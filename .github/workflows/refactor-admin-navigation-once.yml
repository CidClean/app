name: Refactor admin navigation once

on:
  push:
    branches:
      - codex/phase-1-production-hardening
    paths:
      - .github/workflows/refactor-admin-navigation-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-1-production-hardening
          fetch-depth: 0

      - name: Apply refactor
        run: python scripts/refactor_admin_navigation.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(admin): replace tabs with hamburger navigation"
          git push origin HEAD:codex/phase-1-production-hardening
